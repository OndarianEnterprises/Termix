name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., 26.10.0)"
        required: true
      build_type:
        description: "Build type"
        required: true
        default: "Development"
        type: choice
        options:
          - Development
          - Beta
          - Production
      source_ref:
        description: "Git ref/SHA to build (defaults to the workflow ref)"
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: "Version to build (e.g., 26.10.0)"
        required: true
        type: string
      build_type:
        description: "Build type (Development, Beta or Production)"
        required: true
        type: string
      dry_run:
        description: "Build the image but do not push to any registry"
        required: false
        type: boolean
        default: false
      source_ref:
        description: "Git ref/SHA to build"
        required: false
        type: string
        default: ""

jobs:
  # One image per plugin profile (docker/bundled-plugins.json). standard keeps
  # the plain tags; minimal and full add a suffix.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, minimal, full]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 1

      - name: Resolve source revision
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # The image reads its version from package.json, so a beta has to say so.
      - name: Stamp beta version
        if: ${{ inputs.build_type == 'Beta' }}
        run: node scripts/sync-version.cjs --version "${{ inputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine tags
        id: tags
        run: |
          VERSION=${{ inputs.version }}
          BUILD_TYPE=${{ inputs.build_type }}

          TAGS=()
          ALL_TAGS=()

          SUFFIX=""
          if [ "${{ matrix.profile }}" != "standard" ]; then
            SUFFIX="-${{ matrix.profile }}"
          fi

          if [ "$BUILD_TYPE" = "Production" ]; then
            TAGS+=("$VERSION$SUFFIX" "latest$SUFFIX")
          elif [ "$BUILD_TYPE" = "Beta" ]; then
            TAGS+=("beta$SUFFIX" "$VERSION$SUFFIX")
          else
            TAGS+=("dev-$VERSION$SUFFIX")
          fi

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in "${TAGS[@]}"; do
            ALL_TAGS+=("$IMAGE:$tag")
          done

          echo "ALL_TAGS=$(IFS=,; echo "${ALL_TAGS[*]}")" >> $GITHUB_ENV
          echo "TAGS=${TAGS[*]}" >> $GITHUB_ENV

      - name: Login to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ !inputs.dry_run }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.ALL_TAGS }}
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            PLUGIN_PROFILE=${{ matrix.profile }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_CREATED }}
          outputs: ${{ inputs.dry_run && 'type=cacheonly' || 'type=registry,compression=zstd' }}
          cache-from: type=gha,scope=${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.profile }}

      - name: Cleanup Docker
        if: always()
        run: |
          docker image prune -af
          docker system prune -af --volumes
